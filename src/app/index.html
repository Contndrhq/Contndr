    <!-- 
      CRITICAL SEO FIX: Synchronous inline script to intercept and neutralize 
      any platform-injected noindex meta tags BEFORE the parser finishes <head>.
      This runs synchronously during HTML parsing, not deferred like type="module".
    -->
    <script>
      (function() {
        // Immediately remove any existing noindex tags already in the DOM
        document.querySelectorAll('meta[name="robots"]').forEach(function(tag) {
          if (tag.getAttribute('content') && tag.getAttribute('content').indexOf('noindex') !== -1) {
            tag.setAttribute('content', 'index, follow');
          }
        });
        
        // Set up MutationObserver to catch platform-injected noindex tags in real-time
        var observer = new MutationObserver(function(mutations) {
          for (var i = 0; i < mutations.length; i++) {
            var nodes = mutations[i].addedNodes;
            for (var j = 0; j < nodes.length; j++) {
              var node = nodes[j];
              if (node.nodeName === 'META') {
                var name = node.getAttribute('name');
                var httpEquiv = node.getAttribute('http-equiv');
                var content = node.getAttribute('content') || '';
                
                if ((name === 'robots' || httpEquiv === 'X-Robots-Tag') && content.indexOf('noindex') !== -1) {
                  // Override content to allow indexing instead of removing
                  // (removing may cause the platform to re-inject)
                  node.setAttribute('content', 'index, follow');
                }
              }
            }
          }
        });
        
        observer.observe(document.head, { childList: true, subtree: true });
        
        // Also observe documentElement in case tags are added outside <head>
        observer.observe(document.documentElement, { childList: true, subtree: true });
        
        // Keep the observer running - don't disconnect
        window.__seoObserver = observer;
      })();
    </script>

    <!-- Instant Theme Background (Prevents White Flash) -->
    <!-- ══════════════════════════════════════════════════════════════════════════ -->
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('theme');
          var isDark = true; // Default to dark for Contndr
          if (stored === 'light') isDark = false;
          else if (stored === 'system') {
            isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          }
          
          var themeColor = isDark ? '#050505' : '#F9FAFB';
          var textColor = isDark ? '#ffffff' : '#18181b';
          
          document.documentElement.style.backgroundColor = themeColor;
          if (isDark) document.documentElement.classList.add('dark');
          
          // Inject dynamic CSS to ensure body and root match instantly
          var style = document.createElement('style');
          style.textContent = `
            body { 
              margin: 0; 
              padding: 0; 
              font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; 
              background-color: ${themeColor}; 
              color: ${textColor}; 
            } 
            #root { min-height: 100vh; }
          `;
          document.head.appendChild(style);
        } catch (e) {
          // Fallback to dark if localStorage is blocked
          document.documentElement.style.backgroundColor = '#050505';
        }
      })();
    </script>

    <!-- Fast Social OAuth callback: intercept before React loads so the popup
         sends BroadcastChannel + postMessage and closes instantly. -->
    <script>
      (function(){
        if(window.location.pathname!=='/social-oauth-callback')return;
        var p=new URLSearchParams(window.location.search);
        var payload={type:'social-oauth-result'};
        var err=p.get('social_error');
        if(err){payload.social_error=err}
        else if(p.get('linkedin_select_account')==='true'){payload.linkedin_select_account=true}
        else if(p.get('meta_select_pages')==='true'){payload.meta_select_pages=true}
        else{
          var sc=p.get('social_connected');
          if(sc)payload.social_connected=sc;
          var sn=p.get('social_name');
          if(sn)payload.social_name=sn;
        }
        try{var bc=new BroadcastChannel('contndr-social-oauth');bc.postMessage(payload);setTimeout(function(){try{bc.close()}catch(e){}},500)}catch(e){}
        try{if(window.opener&&!window.opener.closed){window.opener.postMessage(payload,'*')}}catch(e){}
        window.__socialOAuthHandled=true;
        document.documentElement.style.background='#050505';
        document.body.innerHTML='<div style="font-family:system-ui;background:#050505;color:#fff;display:flex;align-items:center;justify-content:center;height:100vh"><p style="color:#52525b;font-size:13px">Closing...</p></div>';
        try{window.close()}catch(e){}
        setTimeout(function(){try{window.close()}catch(e){}},150);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
